<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Number</title>
    <link rel="shortcut icon" href="./icon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h2 class="mt-5">Check if a Number is Even, Prime, Armstrong, or a Palindrome</h2>

    <div class="container-box">
        <input type="number" placeholder="Enter a number" class="form-control mb-3" id="inputBox"
            oninput="checkValue()">

        <label for="actionSelect" class="form-label">Check Number:</label>
        <select id="actionSelect" class="form-select mb-4" disabled>
            <option value="">-- Select an option --</option>
            <option value="even">Even Number</option>
            <option value="prime">Prime Number</option>
            <option value="armstrong">Armstrong Number</option>
            <option value="palindrome">Palindrome Number</option>
        </select>

        <button class="btn btn-custom w-100 mb-2" onclick="performAction()">Check</button>
        <button class="btn btn-reset w-100" onclick="resetForm()">Reset</button>

        <p id="result"></p>
    </div>

    <script>
        function checkValue() {
            var num = inputBox.value.trim();
            result.innerHTML = ""; // Clear result
            actionSelect.value = ""; // Reset dropdown selection

            if (num === "") {
                actionSelect.disabled = true; // Disable dropdown if input is empty
            } else {
                actionSelect.disabled = false; // Enable dropdown if input is valid
            }
        }

        function performAction() {
            var num = parseInt(inputBox.value);
            var action = actionSelect.value;
            

            if (isNaN(num)) {
                result.innerHTML = "Please enter a valid number!";
                result.style.color = "red";
                return;
            }
            if (action === "") {
                result.innerHTML = "Please select an option!";
                result.style.color = "red";
                return;
            }

            if (action === "even") {
                isEven(num);
            } else if (action === "prime") {
                isPrime(num);
            } else if (action === "armstrong") {
                isArmstrong(num);
            } else if (action === "palindrome") {
                isPalindrome(num);
            }
        }

        function isEven(num) {
            if (num % 2 === 0) {
                result.innerHTML = num + " is an even number";
                result.style.color = "green";
            } else {
                result.innerHTML = num + " is an odd number";
                result.style.color = "red";
            }
        }

        function isPrime(num) {
            if (num < 2) {
                result.innerHTML = num + " is not a prime number";
                result.style.color = "red";
                return;
            }

            for (var i = 2; i < num; i++) {
                if (num % i === 0) {
                    result.innerHTML = num + " is not a prime number";
                    result.style.color = "red";
                    return;
                }
            }

            result.innerHTML = num + " is a prime number";
            result.style.color = "green";
        }

        function isArmstrong(num) {
            var strNum = num.toString();
            var length = strNum.length;
            var sum = 0;

            for (var i = 0; i < length; i++) {
                sum += Math.pow(parseInt(strNum[i]), length);
            }

            if (sum === num) {
                result.innerHTML = num + " is an Armstrong number";
                result.style.color = "green";
            } else {
                result.innerHTML = num + " is not an Armstrong number";
                result.style.color = "red";
            }
        }

        function isPalindrome(num) {
            var strNum = num.toString();
            var revStrNum = strNum.split('').reverse().join('');

            if (strNum === revStrNum) {
                result.innerHTML = num + " is a palindrome number";
                result.style.color = "green";
            } else {
                result.innerHTML = num + " is not a palindrome number";
                result.style.color = "red";
            }
        }

        function resetForm() {
            inputBox.value = "";
            actionSelect.value = "";
            actionSelect.disabled = true;
            result.innerHTML = "";
        }
    </script>
</body>

</html>
