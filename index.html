<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Number</title>
    <link rel="shortcut icon" href="./icon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #1e3c72;
            font-family: Arial, sans-serif;
        }

        .container-box {
            background: white;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            padding: 30px;
            max-width: 500px;
            margin: auto;
            margin-top: 50px;
        }

        @keyframes fadeBounce {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }

            50% {
                opacity: 0.5;
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            text-align: center;
            color: #fff;
            font-weight: bold;
            margin-bottom: 20px;
            animation: fadeBounce 1.5s ease-in-out;
        }

        input,select {
            border-radius: 8px;
            padding: 10px;
        }

        .btn-custom {
            background: #2a5298;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background: #1e3c72;
        }

        .btn-reset {
            background: #dc3545;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-reset:hover {
            background: #bb2d3b;
        }

        #result {
            font-size: 18px;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h2 class="mt-5">Check if a Number is Even, Prime, Armstrong, or a Palindrome</h2>

    <div class="container-box">
        <input type="number" placeholder="Enter a number" class="form-control mb-3" id="inputBox"
            oninput="checkValue()">

        <label for="actionSelect" class="form-label">Check Number:</label>
        <select id="actionSelect" class="form-select mb-4" disabled>
            <option value="">-- Select an option --</option>
            <option value="even">Even Number</option>
            <option value="prime">Prime Number</option>
            <option value="armstrong">Armstrong Number</option>
            <option value="palindrome">Palindrome Number</option>
        </select>

        <button class="btn btn-custom w-100 mb-2" onclick="performAction()">Check</button>
        <button class="btn btn-reset w-100" onclick="resetForm()">Reset</button>

        <p id="result"></p>
    </div>

    <script>
        function checkValue() {
            var inputBox = document.getElementById("inputBox");
            var actionSelect = document.getElementById("actionSelect");
            var result = document.getElementById("result");

            var num = inputBox.value.trim();
            result.innerHTML = ""; // Clear result
            actionSelect.value = ""; // Reset dropdown selection

            if (num === "") {
                actionSelect.disabled = true; // Disable dropdown if input is empty
            } else {
                actionSelect.disabled = false; // Enable dropdown if input is valid
            }
        }

        function performAction() {
            var num = parseInt(document.getElementById("inputBox").value);
            var action = document.getElementById("actionSelect").value;
            var result = document.getElementById("result");

            if (isNaN(num)) {
                result.innerHTML = "Please enter a valid number!";
                result.style.color = "red";
                return;
            }

            if (action === "even") {
                isEven(num);
            } else if (action === "prime") {
                isPrime(num);
            } else if (action === "armstrong") {
                isArmstrong(num);
            } else if (action === "palindrome") {
                isPalindrome(num);
            }
        }

        function isEven(num) {
            var result = document.getElementById("result");
            if (num % 2 === 0) {
                result.innerHTML = num + " is an even number";
                result.style.color = "green";
            } else {
                result.innerHTML = num + " is an odd number";
                result.style.color = "red";
            }
        }

        function isPrime(num) {
            var result = document.getElementById("result");
            if (num < 2) {
                result.innerHTML = num + " is not a prime number";
                result.style.color = "red";
                return;
            }

            for (var i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) {
                    result.innerHTML = num + " is not a prime number";
                    result.style.color = "red";
                    return;
                }
            }

            result.innerHTML = num + " is a prime number";
            result.style.color = "green";
        }

        function isArmstrong(num) {
            var result = document.getElementById("result");
            var strNum = num.toString();
            var length = strNum.length;
            var sum = 0;

            for (var i = 0; i < length; i++) {
                sum += Math.pow(parseInt(strNum[i]), length);
            }

            if (sum === num) {
                result.innerHTML = num + " is an Armstrong number";
                result.style.color = "green";
            } else {
                result.innerHTML = num + " is not an Armstrong number";
                result.style.color = "red";
            }
        }

        function isPalindrome(num) {
            var result = document.getElementById("result");
            var strNum = num.toString();
            var revStrNum = strNum.split('').reverse().join('');

            if (strNum === revStrNum) {
                result.innerHTML = num + " is a palindrome number";
                result.style.color = "green";
            } else {
                result.innerHTML = num + " is not a palindrome number";
                result.style.color = "red";
            }
        }

        function resetForm() {
            document.getElementById("inputBox").value = "";
            document.getElementById("actionSelect").value = "";
            document.getElementById("actionSelect").disabled = true;
            document.getElementById("result").innerHTML = "";
        }
    </script>
</body>

</html>
